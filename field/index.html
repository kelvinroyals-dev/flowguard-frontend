<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowGuard — Service Provider Portal</title>
<meta name="robots" content="noindex">
<script>
  /* no-flash theme init: apply saved/system theme before first paint */
  (function(){try{var t=localStorage.getItem('fg_field_theme')||'system';
    var dark=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(_){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror the client portal design system (index.html :root) — same
     cyan --brand family, ink/surface scale, radii, shadows, and fonts — so the
     provider portal is a sibling of the client app, not a look-alike. The dark
     theme is the provider-only addition (client portal ships light). */
  :root[data-theme="light"]{
    --bg:#ffffff;--surface:#ffffff;--surface-2:#f7fafb;--surface-3:#eef3f6;--line:#e2e9ed;--line-2:#d3dde2;
    --ink:#12222b;--ink-2:#4a626d;--ink-3:#6f8794;
    --brand:#0891b2;--brand-2:#06b6d4;--brand-deep:#0e5b6e;--brand-soft:#e0f5fa;
    --ok:#10b981;--ok-bg:#e6f7f1;--warn:#f59e0b;--warn-bg:#fef4e2;--alert:#ef4444;--alert-bg:#fdeceb;--lock:#9fb0bc;
    --r:20px;--rs:13px;--rx:9px;
    --sh:0 2px 4px rgba(18,34,43,.03),0 12px 32px rgba(18,34,43,.06);--sh-sm:0 1px 2px rgba(18,34,43,.05);
    --ff:'Inter',sans-serif;--ff-d:'Space Grotesk',sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#0b1418;--surface:#0f1a20;--surface-2:#13212a;--surface-3:#1a2b35;--line:#213039;--line-2:#2b3d47;
    --ink:#e9f2f6;--ink-2:#a6bcc7;--ink-3:#6f8794;
    --brand:#22c5e6;--brand-2:#38d0ee;--brand-deep:#7fdff2;--brand-soft:#0e2b34;
    --ok:#34d399;--ok-bg:#0f2a24;--warn:#fbbf24;--warn-bg:#2c2410;--alert:#f87171;--alert-bg:#2e1616;--lock:#5a6f7c;
    --r:20px;--rs:13px;--rx:9px;
    --sh:0 2px 4px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.35);--sh-sm:0 1px 2px rgba(0,0,0,.3);
    --ff:'Inter',sans-serif;--ff-d:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--ff-d);font-weight:700;font-size:17px;letter-spacing:-.02em;padding:6px 8px 16px}
  .brand .dot{width:24px;height:24px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-family:var(--ff);font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:.13s}
  .nav a:hover:not(.locked){background:var(--surface-2);color:var(--ink)}
  .nav a.active{background:var(--brand);color:#fff;font-weight:600}
  .nav a.locked{color:var(--ink-3);cursor:not-allowed}
  .nav a .lk{margin-left:auto;color:var(--lock);display:none}
  .nav a.locked .lk{display:block}
  .nav a svg{width:19px;height:19px;flex-shrink:0}
  .side .sp{flex:1}
  .side .su{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
  .theme{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:8px}
  .theme button{flex:1;border:0;background:none;color:var(--ink-2);font-size:11.5px;font-weight:600;padding:6px;border-radius:7px;cursor:pointer;font-family:var(--ff)}
  .theme button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
  .signout{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
  .signout:hover{background:var(--surface-2)}
  .signout svg{width:19px;height:19px}
  .main{padding:28px 30px;overflow:auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .top h1{font-family:var(--ff-d);font-size:24px;font-weight:700;letter-spacing:-.02em}
  .top .who{font-size:13px;color:var(--ink-3)}
  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--rs);padding:16px 18px;margin-bottom:22px;font-size:14px;line-height:1.5}
  .banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  .banner b{display:block;margin-bottom:2px;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
  .card h3{font-family:var(--ff-d);font-size:16px;font-weight:600;margin-bottom:6px}
  .card p{color:var(--ink-2);font-size:14px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:0;border-radius:100px;background:var(--brand);color:#fff;font-family:var(--ff-d);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--brand-deep)}
  .btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.sm{padding:8px 15px;font-size:12px}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;z-index:9}.side .brand,.side .su,.side .sp,.theme{display:none}.nav{display:flex;gap:2px}.nav a span:not(.lk){display:none}.main{padding:18px 16px 90px}}
  /* jobs / lists */
  /* segmented filter — identical to the client portal's .seg control */
  .seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:16px}
  .seg button{border:0;background:transparent;color:var(--ink-3);font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer;transition:.12s;font-family:var(--ff);white-space:nowrap}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
  /* data table — identical to the client portal's .tbl / .tbl-wrap */
  .tbl-wrap{overflow-x:auto;padding:0}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr.rowlink{cursor:pointer;transition:background .12s}
  .tbl tbody tr.rowlink:hover{background:var(--surface-2)}
  .tbl .nm{font-weight:600;color:var(--ink)}
  .tbl .ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-3);margin-top:2px}
  .tbl .tbl-arrow{text-align:right;color:var(--brand);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.alert{background:var(--alert-bg);color:var(--alert)}
  .chip.info{background:var(--brand-soft);color:var(--brand-deep)}
  .chip.neutral{background:var(--surface-3);color:var(--ink-2)}
  .pri{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .muted{color:var(--ink-3)}
  /* empty / awaiting state — identical to the client portal's .state */
  .state{padding:50px 30px;text-align:center;color:var(--ink-3)}
  .state .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;margin:0 auto 16px}
  .state .ic svg{width:26px;height:26px;color:var(--ink-3)}
  .state b{display:block;font-family:var(--ff-d);font-size:16px;color:var(--ink);margin-bottom:6px}
  .state p{font-size:13px;max-width:340px;margin:0 auto}
  @media(max-width:760px){
    .tbl thead{display:none}
    .tbl tr{display:block;padding:14px 16px;border-bottom:1px solid var(--line)}
    .tbl tbody tr:last-child{border-bottom:0}
    .tbl td{display:flex;justify-content:space-between;gap:16px;width:100%;padding:3px 0;border:none}
    .tbl td::before{content:attr(data-label);color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .tbl td:first-child::before{display:none}
    .tbl .tbl-arrow{display:none}
  }
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:14px;margin:4px 0 6px}
  .kv dt{color:var(--ink-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  .req{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;margin:4px 5px 0 0}
  .req.ok{color:var(--ok);background:var(--ok-bg)}
  .req.no{color:var(--warn);background:var(--warn-bg)}
  .ev{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--rx);margin-top:8px;font-size:13px}
  .ev .k{font-weight:600;text-transform:capitalize;color:var(--ink-2)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .field{margin:12px 0}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:var(--rx);font-family:var(--ff);font-size:14px;background:var(--surface);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
  .tl{margin-top:6px;border-left:2px solid var(--line);padding-left:14px}
  .tl-i{position:relative;padding:5px 0}
  .tl-i::before{content:'';position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
  .tl-t{font-size:13px;font-weight:600}
  .tl-d{font-size:11px;color:var(--ink-3)}
  .msg{padding:11px 13px;border-radius:var(--rx);font-size:13px;margin:10px 0;display:none}
  .msg.err{background:var(--alert-bg);color:var(--alert);display:block}
  .msg.ok{background:var(--ok-bg);color:var(--ok);display:block}
</style>
</head>
<body>
<div class="app" id="app" style="visibility:hidden">
  <aside class="side">
    <div class="brand"><span class="dot">FG</span> Provider</div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <div class="su">
      <div class="theme" id="theme">
        <button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="system">System</button>
      </div>
      <div class="signout" id="signout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top"><h1 id="pageTitle">Dashboard</h1><div class="who" id="who"></div></div>
    <div id="content"></div>
  </main>
</div>

<script>
  var API='https://api.flowguard.ng/api/v1';
  var $=function(id){return document.getElementById(id);};
  function tok(){try{return localStorage.getItem('token');}catch(_){return null;}}

  /* ---- theme ---- */
  function applyTheme(){var t=localStorage.getItem('fg_field_theme')||'system';
    var dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    Array.prototype.forEach.call(document.querySelectorAll('#theme button'),function(b){b.classList.toggle('on',b.dataset.t===t);});}
  document.getElementById('theme').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;localStorage.setItem('fg_field_theme',b.dataset.t);applyTheme();});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if((localStorage.getItem('fg_field_theme')||'system')==='system')applyTheme();});

  $('signout').addEventListener('click',function(){try{localStorage.removeItem('token');localStorage.removeItem('user');}catch(_){}window.location.href='../login.html';});

  /* ---- menu (locked until org active) ---- */
  var ICONS={
    dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    jobs:'<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    properties:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
    assets:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>',
    team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    notifications:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    profile:'<path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/>',
    support:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
  };
  var LOCK='<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  // key, label, alwaysOpen(available while pending)
  var MENU=[
    ['dashboard','Dashboard',false],['jobs','Jobs',false],['properties','Properties',false],
    ['assets','Assets & Devices',false],['team','Team',false],['notifications','Notifications',false],
    ['profile','Profile & Company',true],['support','Support',true]
  ];

  function renderNav(active){
    $('nav').innerHTML=MENU.map(function(m){
      var locked=STATE.locked&&!m[2];
      return '<a data-k="'+m[0]+'" class="'+(m[0]===active?'active':'')+(locked?' locked':'')+'">'
        +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[m[0]]+'</svg>'
        +'<span>'+m[1]+'</span>'+LOCK+'</a>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('a'),function(a){
      a.addEventListener('click',function(){ if(a.classList.contains('locked')) return; go(a.dataset.k); });
    });
  }

  var STATE={locked:true,org:null,user:null};

  function go(key){
    var m=MENU.filter(function(x){return x[0]===key;})[0]; if(!m) key='profile';
    if(STATE.locked && !(m&&m[2])) key='profile';
    renderNav(key);
    $('pageTitle').textContent=(MENU.filter(function(x){return x[0]===key;})[0]||['','Dashboard'])[1];
    if(key==='profile') return renderProfile();
    if(key==='support') return renderSupport();
    if(key==='jobs') return renderJobs();
    if(key==='properties') return renderProperties();
    $('content').innerHTML='<div class="card"><h3>Coming soon</h3><p>This section is part of the Field product build.</p></div>';
  }

  /* ---- properties (assigned to this provider) ---- */
  function renderProperties(){
    $('content').innerHTML=state('empty','Loading…','');
    api('/service-providers/me/properties').then(function(res){
      if(!res.ok){$('content').innerHTML=state('error',"Couldn't load properties",(res.j&&res.j.error)||'Please try again.');return;}
      var rows=(res.j&&res.j.data)||[];
      if(!rows.length){$('content').innerHTML=state('empty','No properties assigned yet','FlowGuard assigns properties to you when they dispatch a job there.');return;}
      $('content').innerHTML='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Property</th><th>Location</th><th>Type</th></tr></thead><tbody>'
        +rows.map(function(p){
          var loc=[p.city,p.state].filter(Boolean).join(', ')||'—';
          var ptype=p.property_type?esc(String(p.property_type).replace(/_/g,' ')):'—';
          return '<tr><td><div class="nm">'+esc(p.property_name||p.property_id)+'</div></td>'
            +'<td data-label="Location" class="muted">'+esc(loc)+'</td>'
            +'<td data-label="Type" class="muted">'+ptype+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    });
  }

  /* ---- jobs ---- */
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var JT={inspection:'Inspection',drain_cleaning:'Drain cleaning',sensor_maintenance:'Sensor maintenance',repair:'Repair',survey:'Survey',other:'Other'};
  var PR={low:'Low',normal:'Normal',high:'High',urgent:'Urgent'};
  var PRC={low:'var(--ink-3)',normal:'var(--brand)',high:'var(--warn)',urgent:'var(--alert)'};
  var SP_={dispatched:['info','New — respond'],accepted:['info','Accepted'],en_route:['info','En route'],in_progress:['warn','In progress'],completed:['warn','Awaiting verification'],verified:['ok','Verified'],declined:['alert','Declined'],rejected:['alert','Rework needed'],cancelled:['neutral','Cancelled'],draft:['neutral','Draft']};
  var JOB_FILTER='active';
  var FBUCKET={active:['dispatched','accepted','en_route','in_progress','rejected'],completed:['completed'],verified:['verified']};
  function fmtDT(d){return d?new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
  function pill(s){var c=SP_[s]||SP_.draft;return '<span class="chip '+c[0]+'"><span class="d"></span>'+c[1]+'</span>';}
  function api(path,method,body){return fetch(API+path,{method:method||'GET',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};});});}
  /* empty/error state — mirrors the client portal's UI.state */
  var STATE_IC={empty:'<path d="M3 7h18M3 12h18M3 17h18"/>',error:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>'};
  function state(kind,title,body){return '<div class="card"><div class="state"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+(STATE_IC[kind]||STATE_IC.empty)+'</svg></div><b>'+esc(title)+'</b><p>'+esc(body||'')+'</p></div></div>';}

  function renderJobs(){
    var tabs=[['active','Active'],['completed','Submitted'],['verified','Verified']];
    $('content').innerHTML='<div class="seg" id="jchips">'+tabs.map(function(t){return '<button class="'+(t[0]===JOB_FILTER?'on':'')+'" data-s="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div><div id="jlist">'+state('empty','Loading…','')+'</div>';
    $('jchips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;JOB_FILTER=b.dataset.s;renderJobs();});
    api('/jobs').then(function(res){
      var el=$('jlist');
      if(!res.ok){el.innerHTML=state('error',"Couldn't load jobs",(res.j&&res.j.error)||'Please try again.');return;}
      var rows=(res.j&&res.j.data)||[];
      rows=rows.filter(function(r){return (FBUCKET[JOB_FILTER]||[]).indexOf(r.status)>-1;});
      if(!rows.length){el.innerHTML=state('empty','No jobs here',JOB_FILTER==='active'?'New jobs FlowGuard dispatches to you will appear here.':'Nothing in this view yet.');return;}
      el.innerHTML='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Job</th><th>Property</th><th>Priority</th><th>Status</th><th>SLA due</th><th></th></tr></thead><tbody>'
        +rows.map(function(j){
          var pr=PR[j.priority]?'<span class="pri" style="color:'+PRC[j.priority]+'">'+PR[j.priority]+'</span>':'—';
          return '<tr class="rowlink" data-id="'+j.id+'">'
            +'<td><div class="nm">'+esc(j.title)+'</div><div class="ref">'+esc(j.reference||'')+' · '+esc(JT[j.job_type]||j.job_type)+'</div></td>'
            +'<td data-label="Property" class="muted">'+esc(j.property_name||'—')+'</td>'
            +'<td data-label="Priority">'+pr+'</td>'
            +'<td data-label="Status">'+pill(j.status)+'</td>'
            +'<td data-label="SLA due" class="muted">'+(j.sla_due_at?fmtDT(j.sla_due_at):'—')+'</td>'
            +'<td class="tbl-arrow">→</td></tr>';
        }).join('')+'</tbody></table></div>';
      Array.prototype.forEach.call(el.querySelectorAll('.rowlink'),function(r){r.addEventListener('click',function(){openJob(r.dataset.id);});});
    });
  }

  function openJob(id){
    $('content').innerHTML=state('empty','Loading…','');
    api('/jobs/'+id).then(function(res){
      if(!res.ok||!res.j.success){$('content').innerHTML=state('error',"Couldn't load this job",(res.j&&res.j.error)||'Please try again.');return;}
      var j=res.j.data;
      var have={};(j.evidence||[]).forEach(function(e){if(e.evidence_key)have[e.evidence_key]=1;});
      var reqs=Array.isArray(j.required_evidence)?j.required_evidence:[];
      var reqHtml=reqs.length?reqs.map(function(r){return '<span class="req '+(have[r.key]?'ok':'no')+'">'+(have[r.key]?'✓':'○')+' '+esc(r.label||r.key)+'</span>';}).join(''):'<span class="tl-d">No specific evidence required.</span>';
      var evHtml=(j.evidence||[]).map(function(e){return '<div class="ev"><span class="k">'+esc(e.kind)+'</span><span style="flex:1;color:var(--ink-2)">'+esc(e.caption||e.evidence_key||'—')+'</span>'+(e.file_url?'<a href="'+esc(e.file_url)+'" target="_blank" rel="noopener" style="color:var(--brand-deep);font-weight:700">Open</a>':'')+((e.lat!=null&&e.lng!=null)?'<span class="tl-d">'+Number(e.lat).toFixed(3)+','+Number(e.lng).toFixed(3)+'</span>':'')+'</div>';}).join('')||'<div class="tl-d" style="margin-top:6px">Nothing uploaded yet.</div>';
      var LB={created:'Created',dispatched:'Dispatched to you',accepted:'Accepted',declined:'Declined',en_route:'En route',started:'Work started',completed:'Marked complete',verified:'Verified by FlowGuard',rejected:'Returned for rework',cancelled:'Cancelled',evidence_added:'Evidence added',note:'Note'};
      var tl=(j.events||[]).map(function(e){return '<div class="tl-i"><div class="tl-t">'+esc(LB[e.event_type]||e.event_type)+(e.note?' — '+esc(e.note):'')+'</div><div class="tl-d">'+fmtDT(e.created_at)+'</div></div>';}).join('')||'<div class="tl-d">No activity yet.</div>';
      var canEvidence=['accepted','en_route','in_progress'].indexOf(j.status)>-1;
      $('content').innerHTML='<div class="back" id="jback">‹ Back to jobs</div>'
        +'<div class="card"><div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><h3 style="font-size:18px">'+esc(j.title)+'</h3><div class="ref">'+esc(j.reference||'')+'</div></div>'+pill(j.status)+'</div>'
        +'<div class="msg" id="jmsg"></div>'
        +'<dl class="kv" style="margin-top:12px"><dt>Type</dt><dd>'+esc(JT[j.job_type]||j.job_type)+' · '+esc(PR[j.priority]||j.priority)+'</dd>'
        +'<dt>Property</dt><dd>'+esc(j.property_name||'—')+(j.property_address?(' · '+esc(j.property_address)):'')+'</dd>'
        +'<dt>Schedule</dt><dd>'+fmtDT(j.scheduled_for)+'</dd><dt>SLA due</dt><dd>'+fmtDT(j.sla_due_at)+'</dd>'
        +(j.description?'<dt>Details</dt><dd>'+esc(j.description)+'</dd>':'')
        +(j.reject_reason?'<dt>Rework</dt><dd style="color:var(--warn)">'+esc(j.reject_reason)+'</dd>':'')+'</dl>'
        +'<div style="margin-top:12px"><div class="kv" style="grid-template-columns:1fr"><dt>Required evidence</dt></div>'+reqHtml+'</div>'
        +(canEvidence?'<div id="evForm"></div>':'')
        +'<div style="margin-top:14px"><div class="kv" style="grid-template-columns:1fr"><dt>Uploaded</dt></div>'+evHtml+'</div>'
        +'<div class="actions" id="jactions"></div></div>'
        +'<div class="card"><h3 style="font-size:15px">Activity</h3><div class="tl">'+tl+'</div></div>';
      $('jback').addEventListener('click',renderJobs);
      if(canEvidence) renderEvidenceForm(j);
      renderActions(j);
    });
  }

  function msg(t,cls){var m=$('jmsg');if(!m)return;m.className='msg '+cls;m.textContent=t;}
  function act(j,path,body,okText){
    return api('/jobs/'+j.id+path,'POST',body||{}).then(function(res){
      if(res.ok&&res.j.success){openJob(j.id);}
      else if(res.status===422&&res.j.missing){msg('Add these first: '+res.j.missing.join(', '),'err');}
      else{msg((res.j&&res.j.error)||'Action failed','err');}
    }).catch(function(){msg('Network error — try again','err');});
  }

  function renderActions(j){
    var a=$('jactions');if(!a)return;var b=[];
    if(j.status==='dispatched'){
      b.push('<button class="btn" id="a-accept">Accept job</button>');
      b.push('<button class="btn ghost" id="a-decline">Decline</button>');
    } else if(j.status==='accepted'){
      b.push('<button class="btn" id="a-enroute">On my way</button>');
      b.push('<button class="btn ghost" id="a-start">Start work</button>');
    } else if(j.status==='en_route'){
      b.push('<button class="btn" id="a-start">Start work</button>');
    } else if(j.status==='in_progress'){
      b.push('<button class="btn" id="a-complete">Mark complete</button>');
    }
    a.innerHTML=b.join('');
    var bind=function(id,fn){var el=$(id);if(el)el.addEventListener('click',fn);};
    bind('a-accept',function(){$('a-accept').disabled=true;act(j,'/accept');});
    bind('a-enroute',function(){act(j,'/en-route');});
    bind('a-start',function(){act(j,'/start');});
    bind('a-complete',function(){$('a-complete').disabled=true;act(j,'/complete');});
    bind('a-decline',function(){
      var reason=prompt('Why are you declining this job?');
      if(reason&&reason.trim())act(j,'/decline',{reason:reason.trim()});
    });
  }

  function renderEvidenceForm(j){
    var host=$('evForm');if(!host)return;
    host.innerHTML='<div class="card" style="background:var(--surface-2);margin-top:14px;box-shadow:none">'
      +'<h3 style="font-size:14px">Add evidence</h3>'
      +'<div class="field"><label>What is it</label><select id="ev-key"><option value="">General note / photo</option>'
      +(Array.isArray(j.required_evidence)?j.required_evidence.map(function(r){return '<option value="'+esc(r.key)+'" data-kind="'+esc(r.kind||'photo')+'">'+esc(r.label||r.key)+'</option>';}).join(''):'')
      +'</select></div>'
      +'<div class="field"><label>Type</label><select id="ev-kind"><option value="photo">Photo</option><option value="note">Note</option><option value="document">Document</option><option value="video">Video</option><option value="signature">Signature</option><option value="gps">GPS check-in</option></select></div>'
      +'<div class="field"><label>Caption / note</label><input id="ev-cap" placeholder="Short description"></div>'
      +'<div class="field"><label>File link (optional)</label><input id="ev-url" placeholder="Paste a photo/document URL"></div>'
      +'<div class="actions"><button class="btn ghost" id="ev-gps">Use my location</button><button class="btn" id="ev-add">Add evidence</button></div></div>';
    $('ev-key').addEventListener('change',function(){var o=this.options[this.selectedIndex];if(o&&o.dataset.kind)$('ev-kind').value=o.dataset.kind;});
    $('ev-gps').addEventListener('click',function(){
      if(!navigator.geolocation){msg('Location not available on this device','err');return;}
      $('ev-gps').disabled=true;$('ev-gps').textContent='Locating…';
      navigator.geolocation.getCurrentPosition(function(p){
        act(j,'/evidence',{kind:'gps',evidence_key:($('ev-key').value||'gps'),caption:'On-site GPS check-in',lat:p.coords.latitude,lng:p.coords.longitude});
      },function(){msg('Couldn\'t get your location','err');$('ev-gps').disabled=false;$('ev-gps').textContent='Use my location';});
    });
    $('ev-add').addEventListener('click',function(){
      var kind=$('ev-kind').value,cap=$('ev-cap').value.trim(),url=$('ev-url').value.trim(),key=$('ev-key').value||null;
      if(kind==='note'&&!cap){msg('Add a note','err');return;}
      if(kind!=='note'&&kind!=='gps'&&!url&&!cap){msg('Add a file link or caption','err');return;}
      $('ev-add').disabled=true;
      act(j,'/evidence',{kind:kind,evidence_key:key,caption:cap||null,file_url:url||null});
    });
  }

  function renderProfile(){
    var o=STATE.org||{};
    $('content').innerHTML='<div class="card"><h3>'+(o.name||'Your organisation')+'</h3>'
      +'<p>Contact: '+(o.contact_person||'—')+'<br>Email: '+(o.email||'—')+' &middot; Phone: '+(o.phone||'—')
      +'<br>Coverage: '+(o.coverage_area||'—')+'<br>Services: '+((o.service_types&&o.service_types.join(', '))||'—')+'</p>'
      + (STATE.org && STATE.org.status==='pending' && !STATE.org.verification_submitted_at
          ? '<button class="btn" id="submitVerify">Submit for verification</button>'
          : (STATE.org && STATE.org.status==='pending' ? '<p style="margin-top:10px;color:var(--warn)">Submitted — awaiting FlowGuard review.</p>' : ''))
      +'</div>';
    var sv=$('submitVerify'); if(sv) sv.addEventListener('click',async function(){
      sv.disabled=true;sv.textContent='Submitting…';
      try{await fetch(API+'/service-providers/me/submit-verification',{method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'}});}catch(_){}
      STATE.org.verification_submitted_at=new Date().toISOString(); renderProfile();
    });
  }
  function renderSupport(){$('content').innerHTML='<div class="card"><h3>Support</h3><p>Email <a href="mailto:info@flowguard.ng" style="color:var(--brand-deep)">info@flowguard.ng</a> or call 0905 692 5668.</p></div>';}

  function pendingBanner(){
    if(!STATE.locked) return '';
    var rejected=STATE.org&&STATE.org.status==='rejected';
    return '<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div>'
      +(rejected?'<b>Your application was not approved.</b>We\'ve emailed you the reason. You can update your details and re-submit.'
        :'<b>Your account is under review.</b>You\'ll get full access once FlowGuard approves your organisation. Meanwhile you can complete your profile and submit for verification.')
      +'</div></div>';
  }

  /* ---- boot: guard + load org ---- */
  (async function boot(){
    if(!tok()){ window.location.href='../login.html'; return; }
    try{
      var r=await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+tok()}});
      var d=await r.json();
      if(!r.ok||!d.success){ window.location.href='../login.html'; return; }
      var u=d.data.user;
      if(u.user_type!=='service_provider'){
        // wrong portal for this account — send them home
        window.location.href = u.user_type==='internal' ? 'https://neon.flowguard.ng' : '../index.html';
        return;
      }
      STATE.user=u; STATE.org=d.data.organisation||null;
      STATE.locked = !(STATE.org && STATE.org.status==='active');
      $('who').textContent=(STATE.org&&STATE.org.name?STATE.org.name+' · ':'')+(u.full_name||u.email);
      applyTheme();
      renderNav(STATE.locked?'profile':'dashboard');
      $('content').insertAdjacentHTML('afterbegin',pendingBanner());
      go(STATE.locked?'profile':'dashboard');
      // keep banner above content
      if(STATE.locked){ $('content').insertAdjacentHTML('afterbegin',pendingBanner()); }
      $('app').style.visibility='visible';
    }catch(_){ window.location.href='../login.html'; }
  })();
</script>
</body>
</html>
