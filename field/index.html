<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowGuard — Service Provider Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script>
  /* no-flash theme: apply saved/system theme before first paint */
  (function(){try{var t=localStorage.getItem('fg_field_theme')||'system';
    var dark=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(_){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  /* ── tokens: identical to the client portal (index.html :root); dark is the field-only addition ── */
  :root[data-theme="light"]{
    --bg:#ffffff;--surface:#ffffff;--surface-2:#f7fafb;--surface-3:#eef3f6;--line:#e2e9ed;--line-2:#d3dde2;
    --ink:#12222b;--ink-2:#4a626d;--ink-3:#6f8794;
    --brand:#0891b2;--brand-2:#06b6d4;--brand-deep:#0e5b6e;--brand-soft:#e0f5fa;
    --ok:#10b981;--ok-bg:#e6f7f1;--warn:#f59e0b;--warn-bg:#fef4e2;--alert:#ef4444;--alert-bg:#fdeceb;--lock:#9fb0bc;
    --r:20px;--rs:13px;--rx:9px;
    --sh:0 2px 4px rgba(18,34,43,.03),0 12px 32px rgba(18,34,43,.06);--sh-sm:0 1px 2px rgba(18,34,43,.05);
    --ff:'Inter',sans-serif;--ff-d:'Space Grotesk',sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#101216;--surface:#181b20;--surface-2:#121418;--surface-3:#242932;--line:#262a31;--line-2:#333842;
    --ink:#e8f0f3;--ink-2:#9fb4bf;--ink-3:#7f97a5;
    --brand:#0891b2;--brand-2:#06b6d4;--brand-deep:#0e5b6e;--brand-soft:#0d2b33;
    --ok:#10b981;--ok-bg:#0e2b22;--warn:#f59e0b;--warn-bg:#2e2410;--alert:#ef4444;--alert-bg:#2e1613;--lock:#5a6f7c;
    --r:20px;--rs:13px;--rx:9px;
    --sh:0 2px 4px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.3);--sh-sm:0 1px 2px rgba(0,0,0,.3);
    --ff:'Inter',sans-serif;--ff-d:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ff);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  /* ── rail (client portal shell) ── */
  .rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
  .rail-brand{display:flex;align-items:center;gap:8px;padding:2px 8px 16px}
  .rail-brand .logo{height:30px;width:auto;max-width:44px;object-fit:contain}
  .rail-brand .logo-dark{display:none}
  [data-theme="dark"] .rail-brand .logo-light{display:none}
  [data-theme="dark"] .rail-brand .logo-dark{display:block}
  .rail-brand .bl{display:flex;flex-direction:column;line-height:1.05;min-width:0}
  .rail-brand .brand-name{font-family:var(--ff-d);font-size:16px;font-weight:600;letter-spacing:-.01em}
  .rail-brand .tag{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-top:3px}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
  .nav-heading{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:12px 12px 6px}
  .navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink-2);transition:.13s;cursor:pointer;border:none;background:none;text-align:left;font-family:var(--ff);font-size:13px;font-weight:500}
  .navbtn:hover:not(.locked){background:var(--surface-2);color:var(--ink)}
  .navbtn svg{width:19px;height:19px;flex-shrink:0}
  .navbtn .navlabel{white-space:nowrap}
  .navbtn.on{background:var(--brand);color:#fff}
  .navbtn.locked{color:var(--ink-3);cursor:not-allowed}
  .navbtn .lk{margin-left:auto;color:var(--lock);display:none}
  .navbtn.locked .lk{display:block}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
  .rail-user{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:none;background:none;cursor:pointer;text-align:left}
  .rail-user .me-av{width:32px;height:32px;border-radius:50%;background:var(--brand-deep);color:#fff;display:grid;place-items:center;font-family:var(--ff-d);font-weight:600;font-size:13px;flex-shrink:0}
  .rail-user .who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .rail-user .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-user .org{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ── main + sticky header ── */
  .main{padding:0 40px 60px;width:100%;min-width:0}
  .top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 40px;margin:0 -40px 22px;background:var(--surface);border-bottom:1px solid var(--line);min-height:62px}
  .top h1{font-family:var(--ff-d);font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .top .sub{color:var(--ink-3);font-size:12px;margin-top:2px}
  .top-actions{display:flex;align-items:center;gap:8px}
  .section-t{display:flex;align-items:center;justify-content:space-between;font-family:var(--ff-d);font-size:15px;font-weight:600;margin:24px 0 12px}
  .section-t:first-child{margin-top:0}
  /* ── buttons ── */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:100px;background:var(--brand);color:#fff;font-family:var(--ff-d);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--brand-deep)}
  .btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.sm{padding:7px 14px;font-size:12px}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  /* ── cards / kpis ── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
  .card h3{font-family:var(--ff-d);font-size:16px;font-weight:600;margin-bottom:6px}
  .card p{color:var(--ink-2);font-size:14px;line-height:1.6}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
  .kpi-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm)}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .kpi-c .kl{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand);flex-shrink:0}
  .kpi-ic svg{width:18px;height:18px}
  .kpi-c .kn{font-family:var(--ff-d);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .kpi-c .ks{font-size:12px;color:var(--ink-3);margin-top:8px}
  /* ── banner (pending) ── */
  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--rs);padding:16px 18px;margin-bottom:22px;font-size:14px;line-height:1.5}
  .banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  .banner b{display:block;margin-bottom:2px;color:var(--ink)}
  /* ── table ── */
  .tbl-wrap{overflow-x:auto;padding:0}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr.rowlink{cursor:pointer;transition:background .12s}
  .tbl tbody tr.rowlink:hover{background:var(--surface-2)}
  .tbl .nm{font-weight:600;color:var(--ink)}
  .tbl .ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-3);margin-top:2px}
  .tbl .tbl-arrow{text-align:right;color:var(--brand);font-weight:600}
  .muted{color:var(--ink-3)}
  /* ── chips / pills ── */
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.alert{background:var(--alert-bg);color:var(--alert)}
  .chip.info{background:var(--brand-soft);color:var(--brand-deep)}
  .chip.neutral{background:var(--surface-3);color:var(--ink-2)}
  .pri{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  /* ── segmented filter ── */
  .seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:16px}
  .seg button{border:0;background:transparent;color:var(--ink-3);font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer;transition:.12s;font-family:var(--ff);white-space:nowrap}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
  /* ── empty/error state ── */
  .state{padding:50px 30px;text-align:center;color:var(--ink-3)}
  .state .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;margin:0 auto 16px}
  .state .ic svg{width:26px;height:26px;color:var(--ink-3)}
  .state b{display:block;font-family:var(--ff-d);font-size:16px;color:var(--ink);margin-bottom:6px}
  .state p{font-size:13px;max-width:340px;margin:0 auto}
  /* ── job detail bits ── */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
  .kv dt{color:var(--ink-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  .req{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;margin:4px 5px 0 0}
  .req.ok{color:var(--ok);background:var(--ok-bg)}
  .req.no{color:var(--warn);background:var(--warn-bg)}
  .ev{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--rx);margin-top:8px;font-size:13px}
  .ev .k{font-weight:600;text-transform:capitalize;color:var(--ink-2)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .fld{margin:12px 0}
  .fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:var(--rx);font-family:var(--ff);font-size:14px;background:var(--surface);color:var(--ink)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand)}
  .tl{margin-top:6px;border-left:2px solid var(--line);padding-left:14px}
  .tl-i{position:relative;padding:5px 0}
  .tl-i::before{content:'';position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
  .tl-t{font-size:13px;font-weight:600}
  .tl-d{font-size:11px;color:var(--ink-3)}
  .msg{padding:11px 13px;border-radius:var(--rx);font-size:13px;margin:10px 0;display:none}
  .msg.err{background:var(--alert-bg);color:var(--alert);display:block}
  .msg.ok{background:var(--ok-bg);color:var(--ok);display:block}
  /* ── profile ── */
  .phead{display:flex;align-items:center;gap:18px;padding:24px}
  .phead .pav{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-family:var(--ff-d);font-weight:700;font-size:24px;flex-shrink:0}
  .phead .pnm{font-family:var(--ff-d);font-size:22px;font-weight:700;letter-spacing:-.01em}
  .phead .pmeta{color:var(--ink-3);font-size:13px;margin-top:3px}
  .phead .pact{margin-left:auto;display:flex;gap:8px}
  .pgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.pgrid{grid-template-columns:1fr}}
  .card-h{font-family:var(--ff-d);font-size:14px;font-weight:600;padding:16px 20px;border-bottom:1px solid var(--line)}
  .card-b{padding:18px 20px}
  .glance{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .glance .g{background:var(--surface);padding:16px 18px}
  .glance .gn{font-family:var(--ff-d);font-size:26px;font-weight:700;line-height:1}
  .glance .gl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  .prow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .prow:last-child{border-bottom:0}
  .prow .k{color:var(--ink-3);font-weight:500;flex-shrink:0}
  .prow .v{text-align:right}
  /* ── modal ── */
  .mo-back{position:fixed;inset:0;background:rgba(6,12,16,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:mo-fade .15s ease}
  @keyframes mo-fade{from{opacity:0}to{opacity:1}}
  .mo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);width:100%;max-width:460px;overflow:hidden;animation:mo-pop .18s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes mo-pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .mo-h{padding:18px 22px;border-bottom:1px solid var(--line);font-family:var(--ff-d);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
  .mo-h .x{cursor:pointer;color:var(--ink-3);border:0;background:none;font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
  .mo-h .x:hover{background:var(--surface-2);color:var(--ink)}
  .mo-b{padding:18px 22px}
  .mo-b .fld:first-child{margin-top:0}
  .mo-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .mob-toggle{display:none}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;left:0;top:0;bottom:0;width:224px;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh)}
    .rail.open{transform:translateX(0)}
    .mob-toggle{display:grid;place-items:center;position:fixed;top:14px;right:14px;z-index:50;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);cursor:pointer}
    .mob-toggle svg{width:20px;height:20px}
    .main{padding:0 18px 40px}
    .top{padding:12px 66px 12px 18px;margin:0 -18px 18px}
  }
  @media(max-width:760px){
    .tbl thead{display:none}
    .tbl tr{display:block;padding:14px 16px;border-bottom:1px solid var(--line)}
    .tbl tbody tr:last-child{border-bottom:0}
    .tbl td{display:flex;justify-content:space-between;gap:16px;width:100%;padding:3px 0;border:none}
    .tbl td::before{content:attr(data-label);color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .tbl td:first-child::before{display:none}
    .tbl .tbl-arrow{display:none}
    .kv{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app" id="app" style="visibility:hidden">
  <nav class="rail" id="rail">
    <div class="rail-brand">
      <img class="logo logo-light" src="../fg-logo-light.png" alt="FlowGuard">
      <img class="logo logo-dark" src="../fg-logo-dark.png" alt="FlowGuard">
      <span class="bl"><span class="brand-name">FlowGuard</span><span class="tag">Provider Portal</span></span>
    </div>
    <nav class="nav-group" id="nav-work"></nav>
    <div class="nav-group"><div class="nav-heading">Account</div><div id="nav-acct"></div></div>
    <div class="rail-foot">
      <button class="navbtn" id="themeBtn"><span id="themeIc"></span><span class="navlabel" id="themeLabel">Theme</span></button>
      <button class="rail-user" id="signout"><span class="me-av" id="meAv">--</span><span class="who"><span class="nm" id="meName">—</span><span class="org" id="meOrg">Sign out</span></span></button>
    </div>
  </nav>
  <button class="mob-toggle" id="mobToggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
  <main class="main" id="view"></main>
</div>

<script>
  var API='https://api.flowguard.ng/api/v1';
  var $=function(id){return document.getElementById(id);};
  function tok(){try{return localStorage.getItem('token');}catch(_){return null;}}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function api(path,method,body){return fetch(API+path,{method:method||'GET',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};});});}
  function fmtDT(d){return d?new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
  function fmtDate(d){return d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';}

  /* ── icons ── */
  var IC={
    dashboard:'<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/>',
    jobs:'<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    properties:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M15 10h.01"/>',
    team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    notifications:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    profile:'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 9h.01M9 13h.01M9 17h.01"/>',
    support:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check:'<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
    moon:'<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>',
    auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>'
  };

  function msg(t,cls){var m=$('jmsg');if(!m)return;m.className='msg '+cls;m.textContent=t;}
  function act(j,path,body){

      if(res.ok&&res.j.success){openJob(j.id);}
      else if(res.status===422&&res.j.missing){msg('Add these first: '+res.j.missing.join(', '),'err');}
      else{msg((res.j&&res.j.error)||'Action failed','err');}

  function renderActions(j){

  var _evFile=null; // downscaled data-URL of a chosen photo
  function downscale(file,cb){
    var img=new Image(),rd=new FileReader();
    rd.onload=function(){img.onload=function(){
      var max=1600,w=img.width,h=img.height;
      if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{cb(c.toDataURL('image/jpeg',0.82));}catch(_){cb(null);}
    };img.onerror=function(){cb(null);};img.src=rd.result;};
    rd.onerror=function(){cb(null);};rd.readAsDataURL(file);
  }
  function renderEvidenceForm(j){
    _evFile=null;

      +'<div class="fld"><label>Type</label><select id="ev-kind"><option value="photo">Photo</option><option value="note">Note</option><option value="document">Document</option><option value="video">Video</option><option value="signature">Signature</option><option value="gps">GPS check-in</option></select></div>'
      +'<div class="fld" id="ev-photo-wrap"><label>Photo</label><input id="ev-file" type="file" accept="image/*" capture="environment"><div id="ev-prev" style="margin-top:8px"></div></div>'
      +'<div class="fld"><label>Caption / note</label><input id="ev-cap" placeholder="Short description"></div>'
      +'<div class="fld" id="ev-url-wrap"><label>Or paste a file link (optional)</label><input id="ev-url" placeholder="https://…"></div>'
      +'<div class="actions"><button class="btn ghost" id="ev-gps">Use my location</button><button class="btn" id="ev-add">Add evidence</button></div></div>';
    var syncType=function(){var k=$('ev-kind').value;
      $('ev-photo-wrap').style.display=(k==='photo'||k==='signature')?'block':'none';
      $('ev-url-wrap').style.display=(k==='note'||k==='gps')?'none':'block';};
    $('ev-key').addEventListener('change',function(){var o=this.options[this.selectedIndex];if(o&&o.dataset.kind)$('ev-kind').value=o.dataset.kind;syncType();});
    $('ev-kind').addEventListener('change',syncType);syncType();
    $('ev-file').addEventListener('change',function(){
      var f=this.files&&this.files[0];_evFile=null;$('ev-prev').innerHTML='';
      if(!f)return;
      if(f.size>25*1024*1024){msg('That image is too large','err');this.value='';return;}
      $('ev-prev').innerHTML='<span class="tl-d">Processing…</span>';
      downscale(f,function(dataUrl){if(!dataUrl){$('ev-prev').innerHTML='<span class="tl-d">Couldn\'t read that image</span>';return;}
        _evFile=dataUrl;$('ev-prev').innerHTML='<img src="'+dataUrl+'" style="max-width:180px;border-radius:10px;border:1px solid var(--line)">';});
    });
    $('ev-gps').addEventListener('click',function(){
      if(!navigator.geolocation){msg('Location not available on this device','err');return;}
      $('ev-gps').disabled=true;$('ev-gps').textContent='Locating…';
      navigator.geolocation.getCurrentPosition(function(p){act(j,'/evidence',{kind:'gps',evidence_key:($('ev-key').value||'gps'),caption:'On-site GPS check-in',lat:p.coords.latitude,lng:p.coords.longitude});},
        function(){msg('Couldn\'t get your location','err');$('ev-gps').disabled=false;$('ev-gps').textContent='Use my location';});
    });
    $('ev-add').addEventListener('click',function(){
      var kind=$('ev-kind').value,cap=$('ev-cap').value.trim(),url=$('ev-url').value.trim(),key=$('ev-key').value||null;

    });
  }

  /* ── PROFILE ── */
  function renderSupport(){
    $('view').innerHTML=topBar('Support','')+'<div class="card"><h3>We\'re here to help</h3><p>Email <a href="mailto:info@flowguard.ng" style="color:var(--brand-deep);font-weight:600">info@flowguard.ng</a> or call <b>0905 692 5668</b>. For anything about a specific job, mention its reference (e.g. JOB-2026-000101).</p></div>';
  }

  /* ── TEAM ── */
  var SPROLE={owner_admin:['info','Admin'],supervisor:['neutral','Supervisor'],field_technician:['neutral','Technician']};
  function isAdmin(){return STATE.user&&STATE.user.sp_role==='owner_admin';}
  function canInvite(){return STATE.user&&['owner_admin','supervisor'].indexOf(STATE.user.sp_role)>-1;}
  function renderTeam(){
    var actions=canInvite()?'<button class="btn sm" id="team-invite">+ Add member</button>':'';
    $('view').innerHTML=topBar('Team','People in your organisation',actions)+'<div id="tlist">'+stateBox('empty','Loading…','')+'</div>';
    var iv=$('team-invite');if(iv)iv.addEventListener('click',inviteMember);
    api('/service-providers/me/members').then(function(res){
      var el=$('tlist');
      if(!res.ok){el.innerHTML=stateBox('error',"Couldn't load team",(res.j&&res.j.error)||'');return;}
      var rows=(res.j&&res.j.data)||[];
      el.innerHTML='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Member</th><th>Role</th><th>Status</th>'+(isAdmin()?'<th></th>':'')+'</tr></thead><tbody>'
        +rows.map(function(m){
          var role=SPROLE[m.sp_role]||['neutral',m.sp_role||'member'];
          var st=m.is_active?(m.email_verified?['ok','Active']:['warn','Invited']):['alert','Deactivated'];
          var me=m.id===(STATE.user&&STATE.user.id);
          var ctl=isAdmin()&&!me?'<td class="tbl-arrow"><button class="btn ghost sm" data-edit="'+m.id+'">Manage</button></td>':(isAdmin()?'<td class="muted" style="text-align:right">You</td>':'');
          return '<tr><td><div class="nm">'+esc(m.full_name||'—')+'</div><div class="ref" style="font-family:var(--ff)">'+esc(m.email)+'</div></td>'
            +'<td data-label="Role"><span class="chip '+role[0]+'">'+role[1]+'</span></td>'
            +'<td data-label="Status"><span class="chip '+st[0]+'"><span class="d"></span>'+st[1]+'</span></td>'+ctl+'</tr>';
        }).join('')+'</tbody></table></div>';
      Array.prototype.forEach.call(el.querySelectorAll('[data-edit]'),function(b){b.addEventListener('click',function(){manageMember(rows.filter(function(x){return x.id==b.dataset.edit;})[0]);});});
    });
  }
  /* ── reusable modal ── */
  function closeModal(){var m=$('mo-root');if(m)m.remove();}
  function modal(title,bodyHtml,buttons){
    closeModal();
    var back=document.createElement('div');back.className='mo-back';back.id='mo-root';
    back.innerHTML='<div class="mo"><div class="mo-h"><span>'+esc(title)+'</span><button class="x" data-x>&times;</button></div>'
      +'<div class="mo-b">'+bodyHtml+'</div><div class="mo-f" id="mo-foot"></div></div>';
    document.body.appendChild(back);
    back.addEventListener('mousedown',function(e){if(e.target===back)closeModal();});
    back.querySelector('[data-x]').addEventListener('click',closeModal);
    var foot=back.querySelector('#mo-foot');
    (buttons||[]).forEach(function(b){var el=document.createElement('button');el.className='btn'+(b.cls?' '+b.cls:'');el.textContent=b.label;el.addEventListener('click',function(){b.onClick(el);});foot.appendChild(el);});
    var first=back.querySelector('input,select,textarea');if(first)first.focus();
    return back;
  }
  function moErr(t){var m=$('mo-msg');if(m){m.className='msg err';m.textContent=t;}}

  var ROLE_OPTS='<option value="field_technician">Field technician</option><option value="supervisor">Supervisor</option>';
  function inviteMember(){
    var adminOpt=isAdmin()?'<option value="owner_admin">Admin</option>':'';
    modal('Add team member',
      '<div class="msg" id="mo-msg"></div>'
      +'<div class="fld"><label>Full name</label><input id="mo-name" placeholder="e.g. Chidi Okafor"></div>'
      +'<div class="fld"><label>Work email</label><input id="mo-email" type="email" placeholder="name@company.com"></div>'
      +'<div class="fld"><label>Role</label><select id="mo-role">'+ROLE_OPTS+adminOpt+'</select></div>'
      +'<p class="tl-d" style="margin-top:4px">They\'ll get an email with a link to set their password and sign in.</p>',
      [{label:'Cancel',cls:'ghost',onClick:closeModal},
       {label:'Send invite',onClick:function(btn){
         var name=$('mo-name').value.trim(),email=$('mo-email').value.trim(),role=$('mo-role').value;
         if(name.length<2)return moErr('Enter their full name');
         if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return moErr('Enter a valid email');
         btn.disabled=true;btn.textContent='Sending…';
         api('/service-providers/me/members','POST',{full_name:name,email:email,sp_role:role}).then(function(res){
           if(res.ok&&res.j.success){closeModal();renderTeam();}
           else{moErr((res.j&&res.j.error)||'Could not add member');btn.disabled=false;btn.textContent='Send invite';}
         });
       }}]);
  }
  function manageMember(m){
    if(!m)return;
    var cur=m.sp_role;
    modal('Manage '+(m.full_name||m.email),
      '<div class="msg" id="mo-msg"></div>'
      +'<div class="fld"><label>Role</label><select id="mo-role"><option value="field_technician"'+(cur==='field_technician'?' selected':'')+'>Field technician</option>'
        +'<option value="supervisor"'+(cur==='supervisor'?' selected':'')+'>Supervisor</option>'
        +'<option value="owner_admin"'+(cur==='owner_admin'?' selected':'')+'>Admin</option></select></div>'
      +'<p class="tl-d" style="margin-top:4px">'+esc(m.email)+'</p>',
      [{label:'Remove from team',cls:'ghost',onClick:function(btn){
          btn.disabled=true;
          api('/service-providers/me/members/'+m.id,'DELETE').then(function(res){
            if(res.ok&&res.j.success){closeModal();renderTeam();}else{moErr((res.j&&res.j.error)||'Failed');btn.disabled=false;}
          });
        }},
       {label:'Save',onClick:function(btn){
          var role=$('mo-role').value;btn.disabled=true;btn.textContent='Saving…';
          api('/service-providers/me/members/'+m.id,'PUT',{sp_role:role}).then(function(res){
            if(res.ok&&res.j.success){closeModal();renderTeam();}else{moErr((res.j&&res.j.error)||'Failed');btn.disabled=false;btn.textContent='Save';}
          });
        }}]);
  }

  /* ── NOTIFICATIONS ── */
  function renderNotifications(){
    $('view').innerHTML=topBar('Notifications','Updates from FlowGuard',
      '<button class="btn ghost sm" id="ntf-readall">Mark all read</button>')+'<div id="nlist">'+stateBox('empty','Loading…','')+'</div>';
    $('ntf-readall').addEventListener('click',function(){api('/notifications/read-all','PUT',{}).then(renderNotifications);});
    api('/notifications').then(function(res){
      var el=$('nlist');
      if(!res.ok){el.innerHTML=stateBox('error',"Couldn't load notifications",(res.j&&res.j.error)||'');return;}
      var rows=(res.j&&res.j.data)||[];
      if(!rows.length){el.innerHTML=stateBox('empty','No notifications','Job dispatches, verifications and updates from FlowGuard will show up here.');return;}
      var TC={success:'ok',error:'alert',warning:'warn',info:'info'};
      el.innerHTML='<div class="card" style="padding:0">'+rows.map(function(n){
        return '<div style="display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line);'+(n.is_read?'':'background:var(--surface-2)')+'">'
          +'<span class="chip '+(TC[n.type]||'neutral')+'" style="margin-top:2px"><span class="d"></span></span>'
          +'<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+esc(n.title||'')+'</div>'
          +(n.message?'<div class="muted" style="font-size:13px;margin-top:2px">'+esc(n.message)+'</div>':'')
          +'<div class="tl-d" style="margin-top:3px">'+fmtDT(n.created_at)+'</div></div></div>';
      }).join('')+'</div>';
      // mark all as read on view (best-effort)
      api('/notifications/read-all','PUT',{});
    });
  }

  /* ── COMPANY PROFILE (editable) ── */
  function svc(list){return (list&&list.length)?list.map(function(s){return '<span class="chip neutral">'+esc(String(s).replace(/_/g,' '))+'</span>';}).join(' '):'—';}
  function renderProfile(){
    var o=STATE.org||{};
    var st=({active:['ok','Active'],pending:['warn','Under review'],rejected:['alert','Not approved'],suspended:['neutral','Suspended']})[o.status]||['neutral',o.status||'—'];
    var pendingSubmit=o.status==='pending'&&!o.verification_submitted_at;
    var editable=isAdmin();
    var actions=editable?'<button class="btn ghost sm" id="prof-edit">Edit profile</button>':'';
    var row=function(k,v){return '<div class="prow"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>';};
    $('view').innerHTML=topBar('Company profile',(STATE.org&&STATE.org.name)||'',actions)+pendingBanner()
      +'<div class="card" style="padding:0;overflow:hidden">'
        +'<div class="phead"><span class="pav">'+esc((o.name||'F').slice(0,2).toUpperCase())+'</span>'
          +'<div><div class="pnm">'+esc(o.name||'Your organisation')+'</div>'
          +'<div style="margin-top:6px"><span class="chip '+st[0]+'"><span class="d"></span>'+st[1]+'</span></div></div>'
          +(editable?'<div class="pact"><button class="btn ghost sm" id="prof-edit2">Edit profile</button></div>':'')+'</div>'
      +'</div>'
      +'<div class="pgrid">'
        +'<div class="card" style="padding:0"><div class="card-h">Company details</div><div class="card-b">'
          +row('Contact person',esc(o.contact_person||'—'))
          +row('Email',esc(o.email||'—'))
          +row('Phone',esc(o.phone||'—'))
          +row('Coverage area',esc(o.coverage_area||'—'))
          +row('Services','<span style="display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">'+svc(o.service_types)+'</span>')
          +row('Member since',fmtDate(o.created_at))
          +'</div></div>'
        +'<div><div class="card" style="padding:0"><div class="card-h">At a glance</div>'
          +'<div class="glance" id="p-glance">'
            +'<div class="g"><div class="gn" id="g-team">–</div><div class="gl">Team members</div></div>'
            +'<div class="g"><div class="gn" id="g-props">–</div><div class="gl">Properties</div></div>'
            +'<div class="g"><div class="gn" id="g-open">–</div><div class="gl">Open jobs</div></div>'
            +'<div class="g"><div class="gn" id="g-verified">–</div><div class="gl">Verified jobs</div></div>'
          +'</div></div>'
          +(pendingSubmit?'<div class="card"><div class="card-b" style="padding:18px 20px"><div style="font-weight:600;margin-bottom:6px">Ready for review?</div><p class="muted" style="font-size:13px;margin-bottom:12px">Submit your profile and FlowGuard will verify your organisation.</p><button class="btn" id="submitVerify">Submit for verification</button></div></div>'
            :(o.status==='pending'?'<div class="card"><div class="card-b"><span class="chip warn"><span class="d"></span>Submitted — awaiting review</span></div></div>':''))
          +'</div>'
      +'</div>';
    var wire=function(id){var e=$(id);if(e)e.addEventListener('click',editProfile);};wire('prof-edit');wire('prof-edit2');
    var sv=$('submitVerify');if(sv)sv.addEventListener('click',function(){sv.disabled=true;sv.textContent='Submitting…';
      api('/service-providers/me/submit-verification','POST',{}).then(function(){STATE.org.verification_submitted_at=new Date().toISOString();renderProfile();});});
    // live counts for "At a glance"
    if(o.status==='active'){
      Promise.all([api('/service-providers/me/members'),api('/service-providers/me/properties'),api('/jobs')]).then(function(r){
        var mem=(r[0].ok&&r[0].j.data)||[],prp=(r[1].ok&&r[1].j.data)||[],jb=(r[2].ok&&r[2].j.data)||[];
        var set=function(id,v){var e=$(id);if(e)e.textContent=v;};
        set('g-team',mem.length);set('g-props',prp.length);
        set('g-open',jb.filter(function(j){return ['dispatched','accepted','en_route','in_progress','rejected'].indexOf(j.status)>-1;}).length);
        set('g-verified',jb.filter(function(j){return j.status==='verified';}).length);
      });
    } else { ['g-team','g-props','g-open','g-verified'].forEach(function(id){var e=$(id);if(e)e.textContent='0';}); }
  }
  function editProfile(){
    var o=STATE.org||{};
    var SERVICES=['inspection','drain_cleaning','sensor_maintenance','repair','survey','other'];
    var chosen=o.service_types||[];
    $('view').innerHTML=topBar('Edit company profile',o.name||'')
      +'<div class="card"><div class="msg" id="pmsg"></div>'
      +'<div class="fld"><label>Organisation name</label><input id="p-name" value="'+esc(o.name||'')+'"></div>'
      +'<div class="fld"><label>Contact person</label><input id="p-person" value="'+esc(o.contact_person||'')+'"></div>'
      +'<div class="fld"><label>Phone</label><input id="p-phone" value="'+esc(o.phone||'')+'"></div>'
      +'<div class="fld"><label>Coverage area</label><input id="p-cov" value="'+esc(o.coverage_area||'')+'"></div>'
      +'<div class="fld"><label>Services offered</label><div id="p-svc" style="display:flex;flex-wrap:wrap;gap:8px">'
        +SERVICES.map(function(s){var on=chosen.indexOf(s)>-1;return '<button type="button" class="chip '+(on?'info':'neutral')+'" data-svc="'+s+'" data-on="'+(on?'1':'0')+'" style="cursor:pointer;border:1px solid var(--line-2)">'+esc(s.replace(/_/g,' '))+'</button>';}).join('')+'</div></div>'
      +'<div class="actions"><button class="btn ghost" id="p-cancel">Cancel</button><button class="btn" id="p-save">Save changes</button></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('#p-svc [data-svc]'),function(b){b.addEventListener('click',function(){var on=b.dataset.on==='1';b.dataset.on=on?'0':'1';b.className='chip '+(on?'neutral':'info');b.style.border='1px solid var(--line-2)';b.style.cursor='pointer';});});
    $('p-cancel').addEventListener('click',renderProfile);
    $('p-save').addEventListener('click',function(){
      var svcs=[];Array.prototype.forEach.call(document.querySelectorAll('#p-svc [data-svc]'),function(b){if(b.dataset.on==='1')svcs.push(b.dataset.svc);});
      var body={name:$('p-name').value.trim(),contactPerson:$('p-person').value.trim(),phone:$('p-phone').value.trim(),coverageArea:$('p-cov').value.trim(),serviceTypes:svcs};
      if(!body.name){var m=$('pmsg');m.className='msg err';m.textContent='Organisation name is required';return;}
      $('p-save').disabled=true;$('p-save').textContent='Saving…';
      api('/service-providers/me','PUT',body).then(function(res){
        if(res.ok&&res.j.success){STATE.org=res.j.data;$('meOrg').textContent=STATE.org.name||'';renderProfile();}
        else{var m=$('pmsg');m.className='msg err';m.textContent=(res.j&&res.j.error)||'Could not save';$('p-save').disabled=false;$('p-save').textContent='Save changes';}
      });
    });
  }

  /* ── wiring ── */
  $('themeBtn').addEventListener('click',function(){var i=THEMES.indexOf(curTheme());localStorage.setItem('fg_field_theme',THEMES[(i+1)%THEMES.length]);applyTheme();});
  $('signout').addEventListener('click',function(){try{localStorage.removeItem('token');localStorage.removeItem('user');}catch(_){}window.location.href='../login.html';});
  $('mobToggle').addEventListener('click',function(){$('rail').classList.toggle('open');});

  /* ── boot ── */
  (function boot(){
    if(!tok()){window.location.href='../login.html';return;}
    api('/auth/me').then(function(res){
      if(!res.ok||!res.j.success){window.location.href='../login.html';return;}
      var u=res.j.data.user;
      if(u.user_type!=='service_provider'){window.location.href=u.user_type==='internal'?'https://neon.flowguard.ng':'../index.html';return;}
      STATE.user=u; STATE.org=res.j.data.organisation||null;
      STATE.locked=!(STATE.org&&STATE.org.status==='active');
      var nm=u.full_name||u.email||'Account';
      $('meName').textContent=nm;
      $('meAv').textContent=(nm.split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2))||'FG';
      $('meOrg').textContent=(STATE.org&&STATE.org.name)||'Sign out';
      applyTheme();
      go(STATE.locked?'profile':'dashboard');
      $('app').style.visibility='visible';
    }).catch(function(){window.location.href='../login.html';});
  })();
</script>
</body>
</html>
