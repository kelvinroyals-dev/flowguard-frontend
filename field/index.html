<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowGuard — Service Provider Portal</title>
<meta name="robots" content="noindex">
<script>
  /* no-flash theme init: apply saved/system theme before first paint */
  (function(){try{var t=localStorage.getItem('fg_field_theme')||'system';
    var dark=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(_){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  :root[data-theme="light"]{--bg:#f4f7f9;--surface:#fff;--surface-2:#eef3f6;--ink:#0f1b24;--ink-2:#43596b;--ink-3:#879aa8;--line:#e4ebf0;--brand:#0d9488;--brand-d:#0b7d72;--warn-bg:#fff7e6;--warn:#b45309;--lock:#9fb0bc;}
  :root[data-theme="dark"]{--bg:#0c1418;--surface:#121c22;--surface-2:#17242c;--ink:#eaf2f6;--ink-2:#9fb4c1;--ink-3:#6b8090;--line:#22333d;--brand:#2dd4bf;--brand-d:#5eead4;--warn-bg:#2a2113;--warn:#f0b45c;--lock:#5a6f7c;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;padding:6px 8px 16px}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:12px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .nav a:hover:not(.locked){background:var(--surface-2);color:var(--ink)}
  .nav a.active{background:var(--brand);color:#fff}
  .nav a.locked{color:var(--ink-3);cursor:not-allowed}
  .nav a .lk{margin-left:auto;color:var(--lock);display:none}
  .nav a.locked .lk{display:block}
  .nav a svg{width:17px;height:17px;flex-shrink:0}
  .side .sp{flex:1}
  .side .su{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
  .theme{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:8px}
  .theme button{flex:1;border:0;background:none;color:var(--ink-2);font-size:11.5px;font-weight:700;padding:6px;border-radius:7px;cursor:pointer;font-family:inherit}
  .theme button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .signout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .signout:hover{background:var(--surface-2)}
  .main{padding:28px 30px;overflow:auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .top h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .top .who{font-size:13px;color:var(--ink-3)}
  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid rgba(180,83,9,.25);border-radius:14px;padding:16px 18px;margin-bottom:22px;font-size:14px;line-height:1.5}
  .banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  .banner b{display:block;margin-bottom:2px;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .card h3{font-size:16px;font-weight:700;margin-bottom:6px}
  .card p{color:var(--ink-2);font-size:14px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;margin-top:12px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;z-index:9}.side .brand,.side .su,.side .sp,.theme{display:none}.nav{display:flex;gap:2px}.nav a span:not(.lk){display:none}.main{padding:18px 16px 90px}}
</style>
</head>
<body>
<div class="app" id="app" style="visibility:hidden">
  <aside class="side">
    <div class="brand"><span class="dot">FG</span> Provider</div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <div class="su">
      <div class="theme" id="theme">
        <button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="system">System</button>
      </div>
      <div class="signout" id="signout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top"><h1 id="pageTitle">Dashboard</h1><div class="who" id="who"></div></div>
    <div id="content"></div>
  </main>
</div>

<script>
  var API='https://api.flowguard.ng/api/v1';
  var $=function(id){return document.getElementById(id);};
  function tok(){try{return localStorage.getItem('token');}catch(_){return null;}}

  /* ---- theme ---- */
  function applyTheme(){var t=localStorage.getItem('fg_field_theme')||'system';
    var dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    Array.prototype.forEach.call(document.querySelectorAll('#theme button'),function(b){b.classList.toggle('on',b.dataset.t===t);});}
  document.getElementById('theme').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;localStorage.setItem('fg_field_theme',b.dataset.t);applyTheme();});
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if((localStorage.getItem('fg_field_theme')||'system')==='system')applyTheme();});

  $('signout').addEventListener('click',function(){try{localStorage.removeItem('token');localStorage.removeItem('user');}catch(_){}window.location.href='../login.html';});

  /* ---- menu (locked until org active) ---- */
  var ICONS={
    dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    jobs:'<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    properties:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
    assets:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>',
    team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    notifications:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    profile:'<path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/>',
    support:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
  };
  var LOCK='<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  // key, label, alwaysOpen(available while pending)
  var MENU=[
    ['dashboard','Dashboard',false],['jobs','Jobs',false],['properties','Properties',false],
    ['assets','Assets & Devices',false],['team','Team',false],['notifications','Notifications',false],
    ['profile','Profile & Company',true],['support','Support',true]
  ];

  function renderNav(active){
    $('nav').innerHTML=MENU.map(function(m){
      var locked=STATE.locked&&!m[2];
      return '<a data-k="'+m[0]+'" class="'+(m[0]===active?'active':'')+(locked?' locked':'')+'">'
        +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[m[0]]+'</svg>'
        +'<span>'+m[1]+'</span>'+LOCK+'</a>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('a'),function(a){
      a.addEventListener('click',function(){ if(a.classList.contains('locked')) return; go(a.dataset.k); });
    });
  }

  var STATE={locked:true,org:null,user:null};

  function go(key){
    var m=MENU.filter(function(x){return x[0]===key;})[0]; if(!m) key='profile';
    if(STATE.locked && !(m&&m[2])) key='profile';
    renderNav(key);
    $('pageTitle').textContent=(MENU.filter(function(x){return x[0]===key;})[0]||['','Dashboard'])[1];
    if(key==='profile') return renderProfile();
    if(key==='support') return renderSupport();
    $('content').innerHTML='<div class="card"><h3>Coming soon</h3><p>This section is part of the Field product build.</p></div>';
  }

  function renderProfile(){
    var o=STATE.org||{};
    $('content').innerHTML='<div class="card"><h3>'+(o.name||'Your organisation')+'</h3>'
      +'<p>Contact: '+(o.contact_person||'—')+'<br>Email: '+(o.email||'—')+' &middot; Phone: '+(o.phone||'—')
      +'<br>Coverage: '+(o.coverage_area||'—')+'<br>Services: '+((o.service_types&&o.service_types.join(', '))||'—')+'</p>'
      + (STATE.org && STATE.org.status==='pending' && !STATE.org.verification_submitted_at
          ? '<button class="btn" id="submitVerify">Submit for verification</button>'
          : (STATE.org && STATE.org.status==='pending' ? '<p style="margin-top:10px;color:var(--warn)">Submitted — awaiting FlowGuard review.</p>' : ''))
      +'</div>';
    var sv=$('submitVerify'); if(sv) sv.addEventListener('click',async function(){
      sv.disabled=true;sv.textContent='Submitting…';
      try{await fetch(API+'/service-providers/me/submit-verification',{method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'}});}catch(_){}
      STATE.org.verification_submitted_at=new Date().toISOString(); renderProfile();
    });
  }
  function renderSupport(){$('content').innerHTML='<div class="card"><h3>Support</h3><p>Email <a href="mailto:info@flowguard.ng" style="color:var(--brand-d)">info@flowguard.ng</a> or call 0905 692 5668.</p></div>';}

  function pendingBanner(){
    if(!STATE.locked) return '';
    var rejected=STATE.org&&STATE.org.status==='rejected';
    return '<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div>'
      +(rejected?'<b>Your application was not approved.</b>We\'ve emailed you the reason. You can update your details and re-submit.'
        :'<b>Your account is under review.</b>You\'ll get full access once FlowGuard approves your organisation. Meanwhile you can complete your profile and submit for verification.')
      +'</div></div>';
  }

  /* ---- boot: guard + load org ---- */
  (async function boot(){
    if(!tok()){ window.location.href='../login.html'; return; }
    try{
      var r=await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+tok()}});
      var d=await r.json();
      if(!r.ok||!d.success){ window.location.href='../login.html'; return; }
      var u=d.data.user;
      if(u.user_type!=='service_provider'){
        // wrong portal for this account — send them home
        window.location.href = u.user_type==='internal' ? 'https://neon.flowguard.ng' : '../index.html';
        return;
      }
      STATE.user=u; STATE.org=d.data.organisation||null;
      STATE.locked = !(STATE.org && STATE.org.status==='active');
      $('who').textContent=(STATE.org&&STATE.org.name?STATE.org.name+' · ':'')+(u.full_name||u.email);
      applyTheme();
      renderNav(STATE.locked?'profile':'dashboard');
      $('content').insertAdjacentHTML('afterbegin',pendingBanner());
      go(STATE.locked?'profile':'dashboard');
      // keep banner above content
      if(STATE.locked){ $('content').insertAdjacentHTML('afterbegin',pendingBanner()); }
      $('app').style.visibility='visible';
    }catch(_){ window.location.href='../login.html'; }
  })();
</script>
</body>
</html>
